<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="gradEspacial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="brilho" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Foguete Vetorial -->
  <g transform="translate(10, 10)">
    <circle cx="20" cy="20" r="18" fill="#121826" stroke="#38bdf8" stroke-width="2" filter="url(#brilho)"/>
    <path d="M20 8 C25 15, 27 25, 27 28 L13 28 C13 25, 15 15, 20 8 Z" fill="url(#gradEspacial)"/>
    <circle cx="20" cy="18" r="3" fill="#060911"/>
    <path d="M13 24 L8 28 L13 28 Z" fill="#38bdf8"/>
    <path d="M27 24 L32 28 L27 28 Z" fill="#38bdf8"/>
    <polygon points="17,29 23,29 20,35" fill="#f59e0b"/>
  </g>

  <!-- Tipografia Espaço Viagem -->
  <text x="60" y="32" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="20" font-weight="700" fill="url(#gradEspacial)">
    Espaço Viagem
  </text>
  <text x="62" y="46" font-family="'Outfit', sans-serif" font-size="10" font-weight="500" fill="#94a3b8" letter-spacing="1.5">
    EXPLORAÇÃO CÓSMICA
  </text>
</svg>
